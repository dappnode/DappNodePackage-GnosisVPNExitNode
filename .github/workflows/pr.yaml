name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate hoprd.cfg.yaml.tpl
        run: ./test/validate-hoprd-config.sh

      - name: Check that VPN clients can't reach local resources
        run: ./test/firewall.sh

      - name: Check the blocklist and per-peer shaping
        run: ./test/traffic.sh

      # Same checks inside the image that ships, so a missing bash/iproute2/iptables/ipset/curl
      # fails here rather than on a DAppNode. Pulls the same base image the package build below
      # does.
      - name: Build the gnosisvpn-server image for the image checks
        run: docker build -t gnosisvpn-server:checks gnosisvpn-server

      - name: Check the firewall inside the built gnosisvpn-server image
        run: FIREWALL_TEST_IMAGE=gnosisvpn-server:checks ./test/firewall.sh

      - name: Check the blocklist and shaping inside the built gnosisvpn-server image
        run: TRAFFIC_TEST_IMAGE=gnosisvpn-server:checks ./test/traffic.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Install dependencies
        run: npm ci

      - name: Build package (validate manifest and compose file)
        run: npx @dappnode/dappnodesdk build --skip_upload --verbose

  publish-ipfs:
    name: Publish test build to IPFS
    needs: test
    if: contains(github.event.pull_request.labels.*.name, 'publish-ipfs')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Install dependencies
        run: npm ci

      - name: Build and upload to IPFS
        run: |
          npx @dappnode/dappnodesdk build \
            --provider "remote" \
            --verbose | tee build.log

          ipfs_hash=$(grep -oP 'Release hash *: \K/ipfs/\w+' build.log)

          echo "### DNP (DAppNode Package) built and uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "Test build published to IPFS: \`${ipfs_hash}\`" >> "$GITHUB_STEP_SUMMARY"
